name: CI devops 2025
on:
  push:
    branches: 
      - main
      - develop
  pull_request:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      # 1. Checkout du code
      - uses: actions/checkout@v4

      # 2. Configuration du JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Build et test avec Maven
      - name: Build and test with Maven
        run: mvn clean verify -f simpleapi/simpleapi/pom.xml

      # 4. Étape SonarCloud
      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=projects-2880 
          -Dsonar.organization=projects-2880 
          -Dsonar.host.url=https://sonarcloud.io 
          --file simpleapi/simpleapi/pom.xml

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-db:latest

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi/simpleapi/httpd
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest

      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest

  deploy:
    needs: build-and-push-docker-image
    # deploy only from main, not from develop or pull requests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ansible runs inside a Docker image instead of being installed on the runner
      - name: Build Ansible image
        run: docker build -t ansible-runner ./ansible

      - name: Write SSH key and Vault password
        run: |
          mkdir -p secrets
          # tr removes Windows line endings (\r), which make the key unreadable
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > secrets/id_rsa
          chmod 600 secrets/id_rsa
          ssh-keygen -y -f secrets/id_rsa > /dev/null && echo "SSH key OK"
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > secrets/vault_pass

      - name: Deploy with Ansible (in Docker)
        run: >
          docker run --rm
          -v "$PWD/ansible:/ansible"
          -v "$PWD/secrets:/secrets:ro"
          ansible-runner
          -i inventories/setup.yml playbook.yml
          --vault-password-file /secrets/vault_pass
          -e ansible_ssh_private_key_file=/secrets/id_rsa
          -e dockerhub_user=${{ secrets.DOCKERHUB_USERNAME }}

      - name: Remove secrets
        if: always()
        run: rm -rf secrets
