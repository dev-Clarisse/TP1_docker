name: CI devops 2025
on:
  #to begin you want to launch this job in main and develop
  push:
    branches: 
      - main
      - develop
  pull_request:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify -f simpleapi/simpleapi/pom.xml

  build-and-push-docker-image:
    needs: test-backend # S'exécute uniquement si le test-backend réussit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Connexion à Docker Hub en utilisant les secrets GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build et Push pour le Backend (API)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      # 2. Build et Push pour la Base de données (DB)
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-db:latest

      # 3. Build et Push pour le HTTPD (Proxy/Web)
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi/simpleapi/httpd
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest