name: CI devops 2025
on:
  push:
    branches: 
      - main
      - develop
  pull_request:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
      # 1. Checkout du code
      - uses: actions/checkout@v4

      # 2. Configuration du JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Build et test avec Maven
      - name: Build and test with Maven
        run: mvn clean verify -f simpleapi/simpleapi/pom.xml

      # 4. Étape SonarCloud
      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=projects-2880 
          -Dsonar.organization=projects-2880 
          -Dsonar.host.url=https://sonarcloud.io 
          --file simpleapi/simpleapi/pom.xml

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi/simpleapi
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-db:latest

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi/simpleapi/httpd
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest

      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest

  deploy:
    needs: build-and-push-docker-image
    # deploy only from main, not from develop or pull requests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pipx install --include-deps ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          # tr removes Windows line endings (\r), which make the key unreadable
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # fails here with a clear message if the key is malformed
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null && echo "SSH key OK"

      - name: Deploy with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: >
          ansible-playbook -i ansible/inventories/setup.yml ansible/playbook.yml
          -e ansible_ssh_private_key_file=$HOME/.ssh/id_rsa
          -e dockerhub_user=${{ secrets.DOCKERHUB_USERNAME }}
